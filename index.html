<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Perbedaan Render Dataset</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #1e1e2f;
    color: white;
    text-align: center;
}
.container {
    width: 80%;
    margin: 20px auto;
}
h2 {
    margin: 25px 0 10px;
}

.modern-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 30px;
    background: #2a2a40;
    border-radius: 10px;
    overflow: hidden;
}
.modern-table th {
    background: #4CAF50;
    padding: 12px;
}
.modern-table td {
    padding: 12px;
}
.modern-table tr:nth-child(even) {
    background: #24243a;
}

.list {
    list-style: none;
    padding: 0;
}
.list li {
    background: #3a3a5a;
    margin: 5px 0;
    padding: 10px;
    border-radius: 6px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
}
.card {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: black;
    padding: 15px;
    border-radius: 10px;
    font-weight: bold;
}
.card.alt {
    background: linear-gradient(135deg, #a18cd1, #fbc2eb);
}
</style>
</head>
<body>

<div class="container">

    <h2>TABLE 1 (Render Biasa / Manual - Imperative)</h2>
    <table class="modern-table">
        <thead>
            <tr><th>ID</th><th>Nama</th></tr>
        </thead>
        <tbody id="table1"></tbody>
    </table>

    <h2>TABLE 2 (DRY, Reuse, Modular - Declarative)</h2>
    <table class="modern-table">
        <thead>
            <tr><th>ID</th><th>Nama</th></tr>
        </thead>
        <tbody id="table2"></tbody>
    </table>

    <h2>LIST 1 (Dari Table 1 - Render Biasa)</h2>
    <ul id="list1" class="list"></ul>

    <h2>LIST 2 (Dari Table 2 - DRY, Reuse, Modular)</h2>
    <ul id="list2" class="list"></ul>

    <h2>CARD 1 (Dari Table 1 - Render Biasa)</h2>
    <div id="card1" class="cards"></div>

    <h2>CARD 2 (Dari Table 2 - DRY, Reuse, Modular)</h2>
    <div id="card2" class="cards"></div>

</div>

<script>

const data = [
    { id: 101, nama: "Andi Pratama" },
    { id: 102, nama: "Siti Rahma" },
    { id: 103, nama: "Budi Santoso" },
    { id: 104, nama: "Rina Kartika" },
    { id: 105, nama: "Fajar Nugraha" }
];

const t1 = document.getElementById("table1");
data.forEach(item => {
    t1.innerHTML += `<tr><td>${item.id}</td><td>${item.nama}</td></tr>`;
});

const rowTemplate = (item) => `
<tr>
    <td>✨ ${item.id}</td>
    <td>${item.nama.toUpperCase()}</td>
</tr>`;
const listTemplate1 = (item) => `<li>${item.id} - ${item.nama}</li>`;
const listTemplate2 = (item) => `<li>✨ ${item.nama.toUpperCase()} (${item.id})</li>`;

const cardTemplate1 = (item) => `<div class="card">${item.nama}<br>ID: ${item.id}</div>`;
const cardTemplate2 = (item) => `<div class="card alt">👤 ${item.nama}<br><small>${item.id}</small></div>`;

function render(target, template) {
    document.getElementById(target).innerHTML = data.map(template).join("");
}

render("table2", rowTemplate);
render("list1", listTemplate1);
render("list2", listTemplate2);
render("card1", cardTemplate1);
render("card2", cardTemplate2);

</script>

</body>
</html>
